name: Update Goals Against by Position

on:
  schedule:
    # Cron is UTC. ET shown as EDT (Mar-Nov) / EST (Nov-Mar).
    # Off the top of the hour: GitHub delays/drops :00 schedules under load.
    # 09:07 UTC = 5:07 AM EDT / 4:07 AM EST - refresh after last night's games
    # (all final by ~1:30 AM ET), then lock today's picks from the fresh data.
    - cron: '7 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-data-publish
  cancel-in-progress: false

jobs:
  update-goals-against:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6
        with:
          # Branch tip at job start, not the SHA captured when the (possibly
          # delayed or queued) event fired, so the push is not rejected.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh goals against data
        run: python scraper/scrape_goals_against.py

      - name: Log today's picks from the refreshed data
        run: python scraper/picks_log.py log

      - name: Grade finished picks
        run: python scraper/picks_log.py grade

      - name: Build today's player prop sheet
        id: prop_sheet
        continue-on-error: true
        run: python scraper/build_prop_sheet.py

      - name: Build the player spotlight feed
        id: spotlight
        continue-on-error: true
        run: python scraper/build_spotlight.py

      # A derived feed failure must not discard completed Picks grading. Restore
      # failed feed output so a partial file cannot be included in the data commit.
      - name: Restore failed player prop sheet
        if: steps.prop_sheet.outcome == 'failure'
        run: git restore -- data/prop_sheet.json

      - name: Restore failed player spotlight feed
        if: steps.spotlight.outcome == 'failure'
        run: git restore -- data/spotlight.json

      - name: Commit refreshed data
        run: |
          git config user.email "scraper@bot"
          git config user.name "Scraper Bot"
          git add data/goals_against_by_position.json data/picks_log.json data/prop_sheet.json data/spotlight.json
          if git diff --cached --quiet; then
            echo "No data changes to publish"
          else
            git commit -m "Update goals against by position $(date +%F)"
            git push
          fi

      # Report failure after publication: successful upstream updates survive,
      # while the run remains visibly failed for troubleshooting and retry.
      - name: Report derived feed failures after publishing
        if: always() && (steps.prop_sheet.outcome == 'failure' || steps.spotlight.outcome == 'failure')
        run: |
          echo "::error::A derived player feed failed. Successful upstream data was retained for publication; failed feeds kept their previous version. Check the build and commit steps above."
          echo "Derived player feed refresh failed; previous feed retained. Check publication step for upstream update status." >> "$GITHUB_STEP_SUMMARY"
          exit 1
