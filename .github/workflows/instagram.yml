name: Post Instagram Cards

on:
  schedule:
    # Cron is UTC, off the top of the hour (GitHub delays :00 schedules).
    # 18:47 UTC = 2:47 PM EDT / 1:47 PM EST — after the morning-skate lineup
    # refresh, before East Coast puck drop.
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Instagram (unchecked = render cards only)'
        type: boolean
        default: false
      include_preseason:
        description: 'Include preseason games (for testing)'
        type: boolean
        default: false
      theme:
        description: 'Card style'
        type: choice
        options: [light, dark]
        default: light
      force:
        description: 'Post again even if today already went out'
        type: boolean
        default: false
      mode:
        description: 'Which carousel'
        type: choice
        options: [daily, recap]
        default: daily
      date:
        description: 'Date to use (YYYY-MM-DD, Eastern). Blank = today'
        type: string
        default: ''
      game_id:
        description: 'Recap this game id instead of picking the best one'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: nhl-data-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The cards are rendered by /api/og on the deployed site, so this only
      # needs the script itself — no build step.
      - name: Build and post cards
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Publishing stays off until the secrets exist and IG_PUBLISH is set
          # to true (repository variable, or the checkbox on a manual run).
          IG_PUBLISH: ${{ inputs.publish || vars.IG_PUBLISH }}
          IG_INCLUDE_PRESEASON: ${{ inputs.include_preseason }}
          IG_THEME: ${{ inputs.theme }}
          IG_FORCE: ${{ inputs.force }}
          IG_MODE: ${{ inputs.mode }}
          IG_GAME_ID: ${{ inputs.game_id }}
          IG_DATE: ${{ inputs.date }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          # graph.facebook.com (Facebook Login) or graph.instagram.com (Instagram Login)
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: node scripts/instagram-post.mjs

      - name: Upload rendered cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-cards
          path: ig-cards/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit the post log
        run: |
          git config user.email "scraper@bot"
          git config user.name "Scraper Bot"
          git add data/instagram_log.json
          if git diff --cached --quiet; then
            echo "Nothing published, so no log change"
          else
            git commit -m "Log Instagram post $(date +%F)"
            git push
          fi
