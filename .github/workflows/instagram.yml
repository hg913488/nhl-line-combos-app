name: Post Instagram Cards

on:
  schedule:
    # Cron is UTC, off the top of the hour (GitHub delays :00 schedules).
    # 18:47 UTC = 2:47 PM EDT / 1:47 PM EST — after the morning-skate lineup
    # refresh, before East Coast puck drop. This one posts the daily slate.
    - cron: '47 18 * * *'
    # Recaps run twice: 1:47 AM ET posts whatever has finished, and 9:07 AM ET
    # sweeps up West Coast games that were still live. The log keys recaps by
    # game id, so the sweep cannot repost what the late run already covered.
    - cron: '47 5 * * *'
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Instagram (unchecked = render cards only)'
        type: boolean
        default: false
      include_preseason:
        description: 'Include preseason games (for testing)'
        type: boolean
        default: false
      theme:
        description: 'Card style'
        type: choice
        options: [light, dark]
        default: light
      force:
        description: 'Post again even if today already went out'
        type: boolean
        default: false
      mode:
        description: 'Which carousel'
        type: choice
        options: [daily, recap]
        default: daily
      date:
        description: 'Date to use (YYYY-MM-DD, Eastern). Blank = today'
        type: string
        default: ''
      game_id:
        description: 'Recap this game id instead of picking the best one'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: nhl-data-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A scheduled run carries no inputs, so the cron that fired decides the
      # mode. Both recap runs look back a day: at 1:47 AM ET the date has
      # already rolled over, and GitHub often starts these runs hours late.
      # The theme alternates by Eastern day (even day = light, odd = dark), so
      # a day's recap and slate share a look and the next day flips it.
      - name: Decide mode, date and theme for scheduled runs
        if: github.event_name == 'schedule'
        run: |
          et_day=$(( $(date -u -d "$(TZ=America/New_York date +%F)" +%s) / 86400 ))
          if [ $(( et_day % 2 )) -eq 1 ]; then theme=dark; else theme=light; fi
          echo "SCHEDULED_THEME=$theme" >> "$GITHUB_ENV"
          case "${{ github.event.schedule }}" in
            '47 5 * * *')
              echo "SCHEDULED_MODE=recap" >> "$GITHUB_ENV"
              echo "SCHEDULED_DATE=$(TZ=America/New_York date -d yesterday +%F)" >> "$GITHUB_ENV"
              ;;
            '7 13 * * *')
              echo "SCHEDULED_MODE=recap" >> "$GITHUB_ENV"
              echo "SCHEDULED_DATE=$(TZ=America/New_York date -d yesterday +%F)" >> "$GITHUB_ENV"
              ;;
            *)
              echo "SCHEDULED_MODE=daily" >> "$GITHUB_ENV"
              ;;
          esac

      # The cards are rendered by /api/og on the deployed site, so this only
      # needs the script itself — no build step.
      - name: Build and post cards
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Scheduled runs take the repository variables; a manual run takes the
          # form. format() matters here: a bare `inputs.publish || vars.X` falls
          # through to the variable whenever the box is UNchecked, which would
          # make "render cards only" publish anyway. Wrapping it yields the
          # string "false", which is truthy to the expression and falsy to the
          # script, so an explicit unchecked box still wins.
          IG_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.publish) || vars.IG_PUBLISH }}
          IG_INCLUDE_PRESEASON: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.include_preseason) || vars.IG_INCLUDE_PRESEASON }}
          IG_THEME: ${{ inputs.theme || env.SCHEDULED_THEME }}
          IG_FORCE: ${{ inputs.force }}
          IG_MODE: ${{ inputs.mode || env.SCHEDULED_MODE }}
          IG_GAME_ID: ${{ inputs.game_id }}
          IG_DATE: ${{ inputs.date || env.SCHEDULED_DATE }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          # graph.facebook.com (Facebook Login) or graph.instagram.com (Instagram Login)
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: node scripts/instagram-post.mjs

      - name: Upload rendered cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-cards
          path: ig-cards/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit the post log
        run: |
          git config user.email "scraper@bot"
          git config user.name "Scraper Bot"
          git add data/instagram_log.json
          if git diff --cached --quiet; then
            echo "Nothing published, so no log change"
          else
            git commit -m "Log Instagram post $(date +%F)"
            git push
          fi
