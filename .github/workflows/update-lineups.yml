name: Update NHL Line Combos

on:
  schedule:
    # Cron is UTC. ET shown as EDT (Mar-Nov) / EST (Nov-Mar).
    # Minutes avoid :00/:15/:30/:45: GitHub delays/drops top-of-hour schedules
    # under load. Goals-against + first pick log run separately at 09:07 UTC.
    # 07:23 UTC = 3:23 AM EDT / 2:23 AM EST - overnight catch-up: grade late
    #             West Coast finals; picks are NOT logged (GA not refreshed yet).
    - cron: '23 7 * * *'
    # 16:11 UTC = 12:11 PM EDT / 11:11 AM EST - East/Central morning skate lines.
    - cron: '11 16 * * *'
    # 18:37 UTC = 2:37 PM EDT / 1:37 PM EST - West morning skates, matinee news.
    - cron: '37 18 * * *'
    # 22:23 UTC = 6:23 PM EDT / 5:23 PM EST - East warmups, starting goalies.
    - cron: '23 22 * * *'
    # 23:41 UTC = 7:41 PM EDT / 6:41 PM EST - Central warmups, late goalie news.
    - cron: '41 23 * * *'
    # 02:13 UTC = 10:13 PM EDT / 9:13 PM EST - West warmups, starting goalies.
    - cron: '13 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-data-publish
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6
        with:
          # Branch tip at job start, not the SHA captured when the (possibly
          # delayed or queued) event fired, so the push is not rejected.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test scraper pipelines
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Preserve previous lineup snapshot
        run: cp data/lines.json /tmp/lines.previous.json

      - name: Refresh lineups and injuries
        run: python scraper/scrape_lines.py

      - name: Build lineup change history
        run: |
          python scraper/lineup_history.py \
            --previous /tmp/lines.previous.json \
            --current data/lines.json \
            --history data/lineup_changes.json

      - name: Refresh starting goalies
        run: python scraper/scrape_goalies.py

      - name: Refresh playoff bracket
        run: python scraper/scrape_playoff_bracket.py

      # Catch-up only: picks are normally locked by the 09:07 UTC goals-against
      # run. Idempotent and never logs a game that has started. Must match the
      # overnight cron string above.
      - name: Log any unlogged picks for today
        if: github.event.schedule != '23 7 * * *'
        run: python scraper/picks_log.py log

      - name: Grade finished picks
        run: python scraper/picks_log.py grade

      # Roles, goalies and opponent context change through the day, so rebuild
      # the sheet on every lineup refresh.
      - name: Rebuild today's player prop sheet
        id: prop_sheet
        continue-on-error: true
        run: python scraper/build_prop_sheet.py

      # A derived feed failure must not discard completed Picks grading. Restore
      # failed feed output so a partial file cannot be included in the data commit.
      - name: Restore failed player prop sheet
        if: steps.prop_sheet.outcome == 'failure'
        run: git restore -- data/prop_sheet.json

      - name: Commit refreshed data
        run: |
          git config user.email "scraper@bot"
          git config user.name "Scraper Bot"
          git add data/lines.json data/lineup_changes.json data/goalies.json data/playoff_bracket.json data/picks_log.json data/prop_sheet.json
          if git diff --cached --quiet; then
            echo "No data changes to publish"
          else
            git commit -m "Update NHL data $(date +%F)"
            git push
          fi

      # Report failure after publication: successful upstream updates survive,
      # while the run remains visibly failed for troubleshooting and retry.
      - name: Report derived feed failures after publishing
        if: always() && (steps.prop_sheet.outcome == 'failure')
        run: |
          echo "::error::A derived player feed failed. Successful upstream data was retained for publication; failed feeds kept their previous version. Check the build and commit steps above."
          echo "Derived player feed refresh failed; previous feed retained. Check publication step for upstream update status." >> "$GITHUB_STEP_SUMMARY"
          exit 1
