name: Probe ESPN reachability
on:
  push:
    branches: [probe-espn]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { n: [1, 2] }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Real ESPN injury code
        run: |
          curl -s https://api.ipify.org; echo
          python - <<'PY'
          import time
          from scraper import scrape_lines as s
          start = time.time()
          for team in s.TEAMS:
              s.scrape_team(team); time.sleep(1)
          print(f"DF done in {time.time()-start:.0f}s; cookies: {[ (c.domain, c.name) for c in s.SESSION.cookies]}")
          try:
              ids = s.fetch_espn_team_ids()
              inj = s.scrape_espn_injuries(ids)
              print(f"RESULT ok {len(inj)} teams {sum(map(len, inj.values()))} players in {time.time()-start:.0f}s")
          except Exception as e:
              print(f"RESULT fail after {time.time()-start:.0f}s: {e}")
          PY
